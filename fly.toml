# fly.toml — first-party agent service
# Deploy:  fly launch --no-deploy   (once, to create the app)
#          fly secrets set AGENT_BASE_URL=https://<app>.fly.dev
#          fly deploy
app = "alive-md-agents"
primary_region = "iad"

[build]
  dockerfile = "packages/agents/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Never scale to zero. Our own verifier probes this service and records a
  # cold-start timeout as `unreachable` - the exact verdict we publish about
  # other people's agents. A liveness claim we cannot keep is worse than none.
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
